# Build de l'image Docker sur GitHub Actions, au lieu du VPS Dokploy.
#
# Pourquoi : Dokploy compilait l'image SUR le serveur, ce qui saturait CPU/RAM et
# faisait planter les autres apps. Ici GHA compile, pousse sur GHCR, puis déclenche
# un simple pull + redeploy côté Dokploy — le VPS ne compile plus rien.
#
# Prérequis (une fois, cf. le playbook tw-webapp « Variante — Dokploy Application ») :
#   - Environments GitHub `prod` et `dev`, chacun avec le secret DOKPLOY_WEBHOOK
#     (URL de déploiement de l'Application Dokploy correspondante) et les variables
#     NEXT_PUBLIC_*.
#   - Côté Dokploy, pour chaque Application : provider Docker (image) pointant sur
#     ghcr.io/stallstudio/qp-frontend:<prod|dev>, Auto Deploy laissé ON (sinon le
#     webhook répond « Automatic deployments are disabled »).

name: build

on:
  push:
    branches: [main, dev]
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # main → Environment "prod" (tag :prod) ; dev → Environment "dev" (tag :dev).
    # Sans cette ligne, les secrets./vars. d'environnement résolvent en chaîne VIDE.
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    permissions:
      contents: read
      # Obligatoire : le repo est en default_workflow_permissions=read, sans quoi
      # le push sur GHCR est refusé.
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Environnement cible
        id: target
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "tag=prod" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/qp-frontend
          # :prod / :dev = tags mobiles suivis par les Applications Dokploy ;
          # :sha-xxxxxxx = immuable, c'est lui qu'on pointe pour un rollback.
          tags: |
            type=raw,value=${{ steps.target.outputs.tag }}
            type=sha,prefix=sha-,format=short

      # ⚠️ Ces deux valeurs sont INLINÉES dans le bundle au `next build` : absentes
      # à ce moment-là, elles ne sont plus rattrapables au runtime, quoi que porte
      # le `.env` du conteneur. Un build-arg vide produisait donc une image où
      # Google Analytics et le Web Push étaient morts — sans le moindre message,
      # jusqu'à ce que la Schedule d'alertes réponde 503 en production. On refuse
      # désormais de publier une telle image plutôt que de la découvrir en prod.
      - name: Vérifier les valeurs publiques (inlinées au build)
        env:
          GA: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID || secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          VAPID: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY || secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          TARGET: ${{ steps.target.outputs.tag }}
        run: |
          missing=""
          [ -n "$GA" ] || missing="$missing NEXT_PUBLIC_GA_MEASUREMENT_ID"
          [ -n "$VAPID" ] || missing="$missing NEXT_PUBLIC_VAPID_PUBLIC_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Manquant dans l'Environment GitHub « ${TARGET} » :${missing}"
            echo "::error::Ces valeurs sont inlinées dans le bundle au build : une image compilée"
            echo "::error::sans elles part en production avec Analytics et alertes push muets."
            echo "::error::Renseigne-les en Variables (ou Secrets) de cet Environment, puis relance."
            exit 1
          fi

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Inlinés dans le bundle navigateur → valeurs publiques uniquement.
          # Lues en `vars.` ou en `secrets.` : ces valeurs n'ont rien de secret
          # (elles finissent dans le JS servi), mais elles vivent aujourd'hui en
          # secrets d'environnement. Le fallback évite qu'un déplacement vers
          # Variables ne les vide en silence. Leur présence est vérifiée juste
          # au-dessus : un build-arg absent ne se voit nulle part au build, mais
          # coûte GA et les alertes push en production.
          build-args: |
            NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID || secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY || secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          cache-from: type=gha,scope=qp-frontend-${{ steps.target.outputs.tag }}
          cache-to: type=gha,scope=qp-frontend-${{ steps.target.outputs.tag }},mode=max

      - name: Redéploiement Dokploy
        env:
          HOOK: ${{ secrets.DOKPLOY_WEBHOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Secret DOKPLOY_WEBHOOK vide pour ${GITHUB_REF_NAME} — image poussée"
            echo "::error::sur GHCR mais aucun redéploiement. Renseigne le secret dans l'Environment,"
            echo "::error::ou clique Redeploy dans Dokploy."
            exit 1
          fi
          # Provider Docker (image) : l'Application n'a plus de branche git, un POST
          # simple suffit. Si Dokploy répondait « Branch Not Match », il faudrait
          # ajouter : -H 'x-github-event: push' -d "{\"ref\":\"$GITHUB_REF\"}"
          curl -fsSL -X POST "$HOOK"
          echo
          echo "Webhook Dokploy déclenché → pull de :${{ steps.target.outputs.tag }} et redémarrage."
